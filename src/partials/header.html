<!-- Logo: placeholder tekstual me ikone pendë deri sa te vije logo_reference.png (brief sek. 4) -->
<header class="sticky top-0 z-40 border-b border-ink-100 bg-white/95 backdrop-blur">
  <div class="container-page flex h-20 items-center justify-between gap-4">

    <a href="{{ routes.home }}" class="flex flex-col justify-center leading-none">
      <span class="flex items-center gap-2.5">
        <span class="text-xl font-semibold uppercase tracking-[0.22em] text-ink-900">{{ site.wordmark }}</span>
        <img src="/assets/img/feather-dark.svg" alt="{{ site.logoAlt }}" class="h-6 w-auto" width="100" height="72">
      </span>
      <span class="mt-1.5 block text-sm font-medium text-ink-800">{{ site.personName }}</span>
    </a>

    <nav class="hidden items-center gap-7 lg:flex" aria-label="{{ nav.home }}">
      {{#each navItems}}
      <a href="{{ href }}"
         class="text-sm transition-colors hover:text-gold-700{{#if isActive}} text-gold-700 font-medium{{/if}}{{#unless isActive}} text-ink-700{{/unless}}"
         {{#if isActive}}aria-current="page"{{/if}}>{{ label }}</a>
      {{/each}}

      <a href="{{ switcher.href }}" hreflang="{{ switcher.lang }}" lang="{{ switcher.lang }}"
         class="border-l border-ink-200 pl-7 text-sm text-ink-500 transition-colors hover:text-gold-700">
        {{ switcher.labelShort }}
      </a>

      <a href="tel:{{ business.phone }}" class="btn-primary">{{ labels.callNow }}</a>
    </nav>

    <button type="button" id="menu-toggle"
            class="-mr-2 inline-flex h-10 w-10 items-center justify-center rounded-sm text-ink-800 lg:hidden"
            aria-controls="mobile-menu" aria-expanded="false" aria-label="{{ nav.menuOpen }}"
            data-label-open="{{ nav.menuOpen }}" data-label-close="{{ nav.menuClose }}">
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div id="mobile-menu" class="hidden border-t border-ink-100 bg-white lg:hidden">
    <nav class="container-page flex flex-col py-3">
      {{#each navItems}}
      <a href="{{ href }}"
         class="border-b border-ink-50 py-3 text-sm{{#if isActive}} text-gold-700 font-medium{{/if}}{{#unless isActive}} text-ink-700{{/unless}}"
         {{#if isActive}}aria-current="page"{{/if}}>{{ label }}</a>
      {{/each}}
      <a href="{{ switcher.href }}" hreflang="{{ switcher.lang }}" lang="{{ switcher.lang }}"
         class="border-b border-ink-50 py-3 text-sm text-ink-500">{{ switcher.label }}</a>
      <a href="tel:{{ business.phone }}" class="btn-primary mt-4 mb-2">{{ labels.callNow }}</a>
    </nav>
  </div>
</header>
