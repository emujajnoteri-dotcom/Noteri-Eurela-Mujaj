<section class="border-b border-ink-100 bg-ink-50">
  <div class="container-page py-16 sm:py-20">
    <p class="eyebrow">{{ nav.about }}</p>
    <h1 class="mt-4 font-serif text-4xl">{{ page.lead }}</h1>
  </div>
</section>

<section class="section">
  <div class="container-page grid gap-14 lg:grid-cols-[1fr_1.4fr]">
    <figure class="w-full max-w-sm self-start overflow-hidden rounded-sm border border-ink-200">
      <img src="/assets/img/eurela-mujaj.jpg"
           alt="{{ page.portraitAlt }}"
           width="640" height="800"
           class="block h-auto w-full"
           decoding="async">
    </figure>

    <div>
      <h2 class="font-serif text-2xl">{{ page.bioTitle }}</h2>
      <p class="mt-4 leading-relaxed text-ink-700">{{ page.bio }}</p>

      <!-- Diferencues i rendesishem per trust (brief sek. 5) -->
      <div class="mt-10 border-l-2 border-gold-500 bg-ink-50 py-6 pl-6 pr-6">
        <h2 class="font-serif text-xl">{{ page.archiveTitle }}</h2>
        <p class="mt-3 leading-relaxed text-ink-700">{{ page.archiveBody }}</p>
      </div>

      <h2 class="mt-12 font-serif text-2xl">{{ page.valuesTitle }}</h2>
      <dl class="mt-6 grid gap-6 sm:grid-cols-2">
        {{#each page.values}}
        <div class="border-t border-ink-200 pt-4">
          <dt class="font-medium text-ink-900">{{ title }}</dt>
          <dd class="mt-2 text-sm leading-relaxed text-ink-600">{{ body }}</dd>
        </div>
        {{/each}}
      </dl>

      <div class="mt-12">
        <a href="{{ routes.contact }}" class="btn-primary">{{ cta.contact }}</a>
      </div>
    </div>
  </div>
</section>
